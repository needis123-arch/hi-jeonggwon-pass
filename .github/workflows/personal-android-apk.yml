name: Build PERSONAL CENTER Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'personal-app/**'
      - 'personal-center.html'
      - '.github/workflows/personal-android-apk.yml'

concurrency:
  group: personal-center-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: personal-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore final Android signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: personal-app/.signing/debug.keystore
          key: personal-center-final-signing-v1

      - name: Create final Android signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .signing
          keytool -genkeypair -v \
            -keystore .signing/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PERSONAL CENTER,O=HI REALTY,C=KR"

      - name: Show signing certificate
        run: |
          keytool -list -v \
            -keystore .signing/debug.keystore \
            -storepass android \
            -alias androiddebugkey | grep -E "SHA256:|Owner:|Valid from:"

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install native today board
        run: |
          TARGET="android/app/src/main/java/kr/co/hirealty/personalcenter/stable"
          mkdir -p "$TARGET"
          cp native/android/TodayBoardManager.java "$TARGET/TodayBoardManager.java"
          cp native/android/TodayBoardReceiver.java "$TARGET/TodayBoardReceiver.java"
          cp native/android/TodayBoardPlugin.java "$TARGET/TodayBoardPlugin.java"
          cp native/android/TodayBoardWidgetProvider.java "$TARGET/TodayBoardWidgetProvider.java"
          cp native/android/MainActivity.java "$TARGET/MainActivity.java"
          cp -R native/android/res/. android/app/src/main/res/
          python - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          receiver='''        <receiver
              android:name=".TodayBoardReceiver"
              android:enabled="true"
              android:exported="false" />
        <receiver
              android:name=".TodayBoardWidgetProvider"
              android:enabled="true"
              android:exported="true">
            <intent-filter>
                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
            </intent-filter>
            <meta-data
                android:name="android.appwidget.provider"
                android:resource="@xml/today_board_widget_info" />
        </receiver>\n'''
          if '.TodayBoardReceiver' not in s:
              s=s.replace('    </application>', receiver+'    </application>')
          elif '.TodayBoardWidgetProvider' not in s:
              widget='''        <receiver
              android:name=".TodayBoardWidgetProvider"
              android:enabled="true"
              android:exported="true">
            <intent-filter>
                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
            </intent-filter>
            <meta-data
                android:name="android.appwidget.provider"
                android:resource="@xml/today_board_widget_info" />
        </receiver>\n'''
              s=s.replace('    </application>', widget+'    </application>')
          p.write_text(s)
          PY

      - name: Force stable signing config
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle")
          s=p.read_text()
          if "pcStableDebug" not in s:
              s=s.replace("android {", """android {
              signingConfigs {
                  pcStableDebug {
                      storeFile file("../../.signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          """, 1)
              s=s.replace("buildTypes {", """buildTypes {
                  debug {
                      signingConfig signingConfigs.pcStableDebug
                  }
          """, 1)
          p.write_text(s)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK signer
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-center-debug-apk
          path: personal-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
