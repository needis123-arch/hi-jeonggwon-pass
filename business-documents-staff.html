<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>정권통신 · 직원 서류 열람</title>
<style>body{margin:0;background:#f4f6fa;color:#19263c;font:15px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:24px auto;padding:20px}.card{background:white;border:1px solid #dde4ee;border-radius:16px;padding:22px;margin:16px 0}h1{font-size:24px}h2{font-size:19px}input,button{font:inherit;border:1px solid #d4dfec;border-radius:9px;padding:12px;box-sizing:border-box}input{width:100%;margin:5px 0 12px}button{background:white;cursor:pointer;margin:4px 4px 4px 0}button.primary{background:#b6ff24;font-weight:700}button:disabled{opacity:.5;cursor:wait}.muted{color:#617189}.msg{white-space:pre-wrap;color:#b12c30}a{color:#215db0}.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}.customer{display:block;width:100%;text-align:left}.customer[aria-current=true]{border-color:#65991d;background:#f0ffe3}#preview img{max-width:100%;max-height:75vh;object-fit:contain}#viewer{min-width:0}label{display:block}.buttons{display:flex;flex-wrap:wrap;gap:4px}[hidden]{display:none!important}@media(max-width:700px){main{margin:0;padding:12px}.card{padding:16px}.grid{grid-template-columns:1fr}}</style></head>
<body><main><h1>정권통신 · 직원 서류 열람</h1><p class="muted">본인 계정으로 신청 → 사장님 승인 → 서류 비밀번호로 보기</p>
<section class="card" id="loginCard"><h2>직원 로그인</h2><label>이메일<input id="email" type="email" autocomplete="username"></label><label>계정 비밀번호<input id="password" type="password" autocomplete="current-password"></label><div class="buttons"><button class="primary" id="login">로그인</button><button id="signup">처음 이용 · 계정 만들기</button></div><p>계정 만들기는 10자 이상 비밀번호가 필요합니다. 가입 확인 메일이 오면 이메일을 확인한 후 로그인하세요.</p></section>
<section class="card" id="requestCard" hidden><div class="buttons"><button id="refresh">승인 상태 새로고침</button><button id="logout">로그아웃</button></div><p id="identity"></p><h2 id="status"></h2><div id="requestForm"><label>직원 이름<input id="name" maxlength="80" autocomplete="name"></label><button id="request" class="primary">사장님에게 열람 요청</button></div><p id="requestHelp" class="muted"></p></section>
<p class="msg" id="message" role="status" aria-live="polite"></p>
<section id="directory" hidden><div class="card"><label>고객 이름 또는 전화번호<input id="search" type="search" placeholder="고객 검색"></label><button id="find">검색</button></div><div class="grid"><div class="card"><h2>고객 서류</h2><div id="customers"></div><div class="buttons"><button id="previous">이전</button><span id="pageNumber"></span><button id="next">다음</button></div></div><div class="card" id="viewer"><p id="selected">고객을 선택하세요.</p><div id="files"></div><label id="unlock" hidden>서류 비밀번호 (숫자 4자리)<input id="docPassword" type="password" inputmode="numeric" autocomplete="off" placeholder="숫자 4자리"></label><p class="muted">이전에 저장한 서류는 당시 비밀번호로 열어 주세요.</p><button id="lock" hidden>사진 닫기 · 잠그기</button><div id="fileTitle"></div><div id="preview"></div></div></div></section>
<p><a href="business-documents-privacy.html">서류 데이터 처리 안내</a> · <a href="business-center.html?page=settings">사장님 장부</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="business-document-crypto.js?v=3.52"></script><script src="business-document-viewer.js?v=3.53"></script><script src="business-documents-staff.js?v=3.53"></script></body></html>
