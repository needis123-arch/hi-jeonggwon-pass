name: Build PERSONAL CENTER Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'personal-app/**'
      - 'personal-center.html'
      - '.github/workflows/personal-android-apk.yml'

concurrency:
  group: personal-center-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: personal-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore stable Android debug signing key
        id: debug-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: personal-center-android-debug-keystore-v1

      - name: Create stable Android debug signing key
        if: steps.debug-key-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install native today board
        run: |
          TARGET="android/app/src/main/java/kr/co/hirealty/personalcenter/app"
          mkdir -p "$TARGET"
          cp native/android/TodayBoardManager.java "$TARGET/TodayBoardManager.java"
          cp native/android/TodayBoardReceiver.java "$TARGET/TodayBoardReceiver.java"
          cp native/android/TodayBoardPlugin.java "$TARGET/TodayBoardPlugin.java"
          cp native/android/MainActivity.java "$TARGET/MainActivity.java"
          python - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          receiver='''        <receiver
              android:name=".TodayBoardReceiver"
              android:enabled="true"
              android:exported="false" />\n'''
          if '.TodayBoardReceiver' not in s:
              s=s.replace('    </application>', receiver+'    </application>')
          p.write_text(s)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-center-debug-apk
          path: personal-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
