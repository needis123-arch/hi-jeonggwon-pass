name: Build PERSONAL CENTER Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'personal-app/**'
      - 'personal-center.html'
      - '.github/workflows/personal-android-apk.yml'

concurrency:
  group: personal-center-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: personal-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore final Android signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: personal-app/.signing/debug.keystore
          key: personal-center-final-signing-v1

      - name: Create final Android signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .signing
          keytool -genkeypair -v \
            -keystore .signing/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PERSONAL CENTER,O=HI REALTY,C=KR"

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install native board and widget
        run: python native/android/install_native.py

      - name: Verify native manifest source
        run: |
          grep -n "TodayBoardReceiver" android/app/src/main/AndroidManifest.xml
          grep -n "TodayBoardWidgetProvider" android/app/src/main/AndroidManifest.xml
          grep -n "APPWIDGET_UPDATE" android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify merged manifest components
        run: |
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -1)"
          if [ -z "$APKANALYZER" ]; then
            echo "apkanalyzer not found"
            exit 1
          fi
          "$APKANALYZER" manifest print android/app/build/outputs/apk/debug/app-debug.apk > /tmp/manifest.xml
          grep -n "TodayBoardReceiver" /tmp/manifest.xml
          grep -n "TodayBoardWidgetProvider" /tmp/manifest.xml
          grep -n "android.appwidget.action.APPWIDGET_UPDATE" /tmp/manifest.xml
          grep -n "today_board_widget_info" /tmp/manifest.xml

      - name: Verify APK signer
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-center-debug-apk
          path: personal-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
