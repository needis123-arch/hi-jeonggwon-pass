<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HI × 정권 관리자 v7.9.2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{
  --bg:#F1F3F1; --surface:#FFFFFF; --ink:#1B2430; --ink-soft:#5A6570; --line:#DDE3DE;
  --navy:#1B2A4A; --teal:#1F8A82; --amber:#C98A2E; --danger:#B0473B; --radius:12px;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',sans-serif;}
h1,h2,h3{font-family:'Noto Serif KR',serif; margin:0 0 6px;}
.wrap{max-width:1600px; width:calc(100% - 24px); margin:0 auto; padding:16px 0 60px;}

/* login */
.loginbox{max-width:340px; margin:80px auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:28px; text-align:center;}
.loginbox h2{font-size:18px; margin-bottom:14px;}
.loginbox input{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; margin-bottom:10px;}
.loginbox button{width:100%; padding:11px; border:none; border-radius:8px; background:var(--navy); color:#fff; font-weight:700; cursor:pointer;}
.loginmsg{font-size:12.5px; color:var(--danger); margin-top:8px; min-height:16px;}

/* app shell */
.topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 4px 18px;}
.mark{font-family:'Noto Serif KR',serif; font-weight:700; font-size:18px;}
.mark .navy{color:var(--navy);} .mark .x{color:var(--ink-soft); font-weight:400;} .mark .teal{color:var(--teal);}
.logout{font-size:12.5px; color:var(--ink-soft); cursor:pointer; text-decoration:underline;}
.tabs{display:flex; gap:6px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:20px;}
.tab{padding:10px 16px; cursor:pointer; font-size:14px; font-weight:500; color:var(--ink-soft); border-bottom:2px solid transparent;}
.tab.active{color:var(--ink); border-bottom-color:var(--amber);}
.panel{display:none;} .panel.active{display:block;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:16px;}
.card h3{font-size:15px;}

/* table */
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:14px;}
.toolbar label{font-size:12px; display:block; margin-bottom:4px; color:var(--ink-soft);}
.toolbar select, .toolbar input{padding:7px 9px; border:1px solid var(--line); border-radius:7px; font-size:13px;}
.toolbar .searchbox{min-width:210px;}
.toolbar .datebox{width:138px;}
.toolbar .checkline{display:flex;align-items:center;gap:6px;height:34px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;color:var(--ink-soft);}
.toolbar .checkline input{margin:0;padding:0;}
.toolbar .spacer{flex:1 1 auto;}
.filter-summary{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
.filter-summary .warn{color:var(--danger);font-weight:700;}
.inline-select.status-new{background:#FFF7DC;border-color:#E7C86E;}
.inline-select.status-contact{background:#EAF3FF;border-color:#AFC8E8;}
.inline-select.status-progress{background:#EAF7F5;border-color:#A8D8D0;}
.inline-select.status-visit{background:#F2ECFF;border-color:#C8B8EA;}
.inline-select.status-done{background:#E7F3EF;border-color:#9CCEBB;font-weight:700;}
.inline-select.status-fail{background:#FBEAE8;border-color:#E2B3AD;color:var(--danger);}
.inline-select.assignee-unassigned{background:#FFF3E7;border-color:#E2B983;color:#8A5C1A;font-weight:700;}
.row-unassigned td:first-child{box-shadow:inset 3px 0 0 #C98A2E;}
.btn{padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:13px; font-weight:500;}
.btn.primary{background:var(--navy); color:#fff; border-color:var(--navy);}
.btn.small{padding:5px 9px; font-size:12px;}
table{width:100%; border-collapse:collapse; font-size:12.5px;}
.leadtable{table-layout:auto;}
.settletable{table-layout:auto;}
th,td{padding:7px 6px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap;}
th{color:var(--ink-soft); font-weight:500; position:sticky; top:0; background:var(--surface);}
tr:hover{background:#FAFBFA;}
.pill{padding:3px 8px; border-radius:20px; font-size:11px; font-weight:600;}
.pill.HI{background:#EAF0FF; color:var(--navy);}
.pill.JK{background:#E7F6F4; color:var(--teal);}
.dup{color:var(--danger); font-weight:700; font-size:11px;}
.inline-input{width:80px; padding:4px 6px; border:1px solid var(--line); border-radius:5px; font-size:12px;}
.inline-select{border:1px solid var(--line); border-radius:5px; padding:4px 6px; font-size:12px;}
.empty{text-align:center; color:var(--ink-soft); padding:30px 0; font-size:13px;}
.tablewrap{overflow-x:auto; max-height:640px; overflow-y:auto;}

/* PC/노트북: 가로스크롤 없이 14개 컬럼을 무조건 한 화면에 표시 */
@media (min-width:651px){
  html,body{width:100%; max-width:100%; overflow-x:hidden;}
  .wrap{max-width:none!important; width:100%!important; margin:0!important; padding:8px 10px 36px!important;}
  #panel-leads .card{width:100%; padding:9px 8px; overflow:hidden;}
  #panel-leads .toolbar{margin-bottom:7px; gap:5px;}
  #panel-leads .tablewrap{
    width:100%; max-width:100%; overflow-x:hidden!important; overflow-y:auto; max-height:72vh;
  }
  .leadtable{
    table-layout:fixed!important;
    width:100%!important;
    min-width:0!important;
    max-width:100%!important;
    font-size:9px;
  }
  .leadtable th,.leadtable td{
    padding:3px 1px!important;
    overflow:hidden!important;
    text-overflow:ellipsis;
    white-space:nowrap!important;
    min-width:0!important;
    max-width:none!important;
  }

  /* 합계 100% — 화면 크기가 달라도 같은 줄 안에 맞춤 */
  .leadtable th:nth-child(1), .leadtable td:nth-child(1){width:7%;}  /* 접수 */
  .leadtable th:nth-child(2), .leadtable td:nth-child(2){width:4%;}  /* 유입 */
  .leadtable th:nth-child(3), .leadtable td:nth-child(3){width:7%;}  /* 담당자 */
  .leadtable th:nth-child(4), .leadtable td:nth-child(4){width:5%;}  /* 고객명 */
  .leadtable th:nth-child(5), .leadtable td:nth-child(5){width:9%;}  /* 연락처 */
  .leadtable th:nth-child(6), .leadtable td:nth-child(6){width:18%;} /* 서비스 */
  .leadtable th:nth-child(7), .leadtable td:nth-child(7){width:7%;}  /* 이사일 */
  .leadtable th:nth-child(8), .leadtable td:nth-child(8){width:5%;}  /* 상담 */
  .leadtable th:nth-child(9), .leadtable td:nth-child(9){width:4%;}  /* 중복 */
  .leadtable th:nth-child(10),.leadtable td:nth-child(10){width:7%;} /* 상태 */
  .leadtable th:nth-child(11),.leadtable td:nth-child(11){width:8%;} /* 계약일 */
  .leadtable th:nth-child(12),.leadtable td:nth-child(12){width:8%;} /* 매출 */
  .leadtable th:nth-child(13),.leadtable td:nth-child(13){width:7%;} /* 정산 */
  .leadtable th:nth-child(14),.leadtable td:nth-child(14){width:4%;} /* 저장 */

  .leadtable .inline-input,.leadtable .inline-select{
    display:block; width:100%!important; max-width:100%!important; min-width:0!important;
    height:25px; padding:1px 1px!important; font-size:8.5px!important; border-radius:4px;
  }
  .leadtable input[type=date]{font-size:7.5px!important; padding:0!important;}
  .leadtable input[type=number]{font-size:8.5px!important;}
  .leadtable .btn.small{display:block; width:100%!important; min-width:0!important; height:25px; padding:1px 0!important; font-size:8px!important;}
  .leadtable .pill{display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; padding:2px 1px!important; font-size:8px!important;}
  .leadtable .dup{font-size:7.5px!important;}

  /* 정산표도 PC 한 화면 */
  #panel-settle .tablewrap{overflow-x:hidden!important;}
  .settletable{table-layout:fixed; width:100%; min-width:0; font-size:11px;}
  .settletable th,.settletable td{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:6px 4px;}
}

/* 휴대폰만 가로 스크롤 허용 */
@media (max-width:650px){
  .wrap{width:auto; margin:0 auto; padding:16px 12px 60px;}
  .leadtable{min-width:1120px;}
  #panel-leads .tablewrap{overflow-x:auto;}
}

/* content editor */
label.field{display:block; font-size:12.5px; font-weight:500; margin:12px 0 5px; color:var(--ink-soft);}
input[type=text], textarea{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px; font-size:13.5px; font-family:inherit;}
textarea{min-height:90px; resize:vertical;}
.rowline{display:grid; grid-template-columns:70px 1fr 90px 34px; gap:8px; align-items:center; margin-bottom:6px;}
.rowline.banner{grid-template-columns:60px 1fr 1fr 90px 34px;}
.rowline input[type=text]{width:100%;}
.rowline select{padding:7px; border:1px solid var(--line); border-radius:6px; font-size:12.5px;}
.rowline input[type=number]{width:100%; padding:7px; border:1px solid var(--line); border-radius:6px; font-size:12.5px;}
.removebtn{background:#FBEAE8; color:var(--danger); border:none; border-radius:6px; cursor:pointer; font-size:14px; padding:6px;}
.addbtn{margin-top:6px; font-size:12.5px;}
.savebar{position:sticky; bottom:0; background:var(--bg); padding:14px 0; margin-top:10px;}
.toast{font-size:12.5px; padding:9px 12px; border-radius:8px; display:none; margin-top:10px;}
.toast.ok{background:#E7F3EF; color:#1F6E52; display:block;}
.toast.err{background:#FBEAE8; color:var(--danger); display:block;}
</style>
</head>
<body>

<div id="loginScreen" class="loginbox">
  <h2>HI × 정권 관리자 로그인</h2>
  <input type="password" id="pwInput" placeholder="관리자 또는 직원 비밀번호">
  <button onclick="login()">로그인</button>
  <div class="loginmsg" id="loginMsg"></div>
</div>

<div class="wrap" id="appShell" style="display:none;">
  <div class="topbar">
    <div class="mark"><span class="navy">HI</span><span class="x">×</span><span class="teal">정권</span> 관리자 <span id="roleBadge" style="font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:500;color:var(--ink-soft);"></span></div>
    <div class="logout" onclick="logout()">로그아웃</div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="leads" id="tabLeads">리드 관리</div>
    <div class="tab" data-tab="settle" id="tabSettle">정산 현황</div>
    <div class="tab" data-tab="content" id="tabContent">콘텐츠 관리</div>
  </div>

  <!-- ===== 리드 관리 ===== -->
  <div class="panel active" id="panel-leads">
    <div class="card">
      <div class="toolbar">
        <div><label>검색</label><input id="f_search" class="searchbox" type="search" placeholder="고객명 · 연락처 · 서비스 · 소개직원"></div>
        <div><label>유입</label><select id="f_source"><option value="">전체</option><option value="HI">HI</option><option value="JK">JK</option></select></div>
        <div><label>상태</label><select id="f_status"><option value="">전체</option><option>신규</option><option>연락완료</option><option>상담중</option><option>방문예약</option><option>계약완료</option><option>실패</option></select></div>
        <div id="assigneeFilterWrap"><label>담당자</label><select id="f_assignee"><option value="">전체</option><option value="__UNASSIGNED__">미지정</option></select></div>
        <div><label>접수일 시작</label><input id="f_from" class="datebox" type="date"></div>
        <div><label>접수일 종료</label><input id="f_to" class="datebox" type="date"></div>
        <label class="checkline" id="unassignedOnlyWrap"><input type="checkbox" id="f_unassigned_only"> 미지정만 보기</label>
        <label class="checkline" id="unassignedFirstWrap"><input type="checkbox" id="f_unassigned_first" checked> 미지정 상단</label>
        <button class="btn" onclick="resetLeadFilters()">필터 초기화</button>
        <button class="btn" onclick="loadLeads()">새로고침</button>
        <div class="spacer"></div>
        <button class="btn" onclick="downloadLeadsCsv()">CSV 다운로드</button>
      </div>
      <div id="leadStats" class="filter-summary"></div>
      <div class="tablewrap">
        <table class="leadtable">
          <thead><tr>
            <th>접수일</th><th>유입</th><th>담당자</th><th>고객명</th><th>연락처</th><th>서비스</th>
            <th>이사일</th><th>상담방법</th><th>중복</th><th>상태</th><th>계약일</th><th>매출액</th><th>정산</th><th></th>
          </tr></thead>
          <tbody id="leadRows"></tbody>
        </table>
        <div class="empty" id="leadEmpty" style="display:none;">리드가 없습니다.</div>
      </div>
    </div>
  </div>

  <!-- ===== 정산 현황 ===== -->
  <div class="panel" id="panel-settle">
    <div class="card">
      <div class="toolbar"><button class="btn" onclick="loadSettlement()">새로고침</button></div>
      <div class="tablewrap">
        <table class="settletable">
          <thead><tr><th>직원</th><th>소속</th><th>소개건수</th><th>담당건수</th><th>계약건수</th><th>전환율</th><th>총매출</th><th>총리베이트</th><th>정산완료</th><th>미정산</th></tr></thead>
          <tbody id="settleRows"></tbody>
        </table>
        <div class="empty" id="settleEmpty" style="display:none;">데이터가 없습니다. 구글시트 "담당자별정산" 탭에 직원을 먼저 추가하세요.</div>
      </div>
    </div>
  </div>

  <!-- ===== 콘텐츠 관리 ===== -->
  <div class="panel" id="panel-content">
    <div class="card">
      <h3>로고 · 브랜드 마크</h3>
      <label class="field">로고 문구 (이미지 URL을 안 넣으면 이 글자가 상단에 노출됨)</label><input type="text" id="c_logo_text" placeholder="HI × 정권">
      <label class="field">로고 이미지 URL (선택, 넣으면 문구 대신 이미지로 노출)</label><input type="text" id="c_logo_img" placeholder="https://...">
    </div>
    <div class="card">
      <h3>PASS A/B 하단 숏폼 영상</h3>
      <label class="field">PASS A 영상 URL (하이부동산 숏폼 — 유튜브/인스타 링크 그대로 붙여넣기)</label><input type="text" id="c_video_a" placeholder="https://www.youtube.com/shorts/... 또는 https://www.instagram.com/reel/...">
      <label class="field">PASS B 영상 URL (정권통신 숏폼)</label><input type="text" id="c_video_b" placeholder="https://...">
    </div>
    <div class="card">
      <h3>히어로 문구</h3>
      <label class="field">제목</label><input type="text" id="c_title">
      <label class="field">부제</label><input type="text" id="c_subtitle">
      <label class="field">태그라인</label><input type="text" id="c_tagline">
    </div>
    <div class="card">
      <h3>PASS 카드 문구</h3>
      <label class="field">PASS A 제목</label><input type="text" id="c_a_title">
      <label class="field">PASS A 라벨 (예: 🏠 하이부동산 고객 전용)</label><input type="text" id="c_a_who">
      <label class="field" style="margin-top:16px;">PASS B 제목</label><input type="text" id="c_b_title">
      <label class="field">PASS B 라벨</label><input type="text" id="c_b_who">
    </div>
    <div class="card">
      <h3>혜택 항목 (추가/삭제, 노출 체크박스로 노출·미노출)</h3>
      <div id="benefitList"></div>
      <button class="btn small addbtn" onclick="addBenefitRow()">+ 항목 추가</button>
    </div>
    <div class="card">
      <h3>메인 배너 · 이벤트 사진</h3>
      <div id="bannerList"></div>
      <button class="btn small addbtn" onclick="addBannerRow()">+ 배너 추가</button>
    </div>
    <div class="card">
      <h3>필요서비스 선택지</h3>
      <label class="field">PASS A 서비스 (한 줄에 하나씩)</label>
      <textarea id="svc_a"></textarea>
      <label class="field">PASS B 서비스 (한 줄에 하나씩)</label>
      <textarea id="svc_b"></textarea>
    </div>
    <div class="savebar">
      <button class="btn primary" onclick="saveContent()">전체 저장</button>
      <div class="toast" id="contentToast"></div>
    </div>
  </div>
</div>

<script>
// 손님용 페이지와 동일한 Apps Script 웹앱 URL
const CONFIG = { WEBAPP_URL: "https://script.google.com/macros/s/AKfycbynYvXKdsCxhdDzEoruAUdUUTWWXvBehJmI5_D6rc1iouEH5HF0sOV2zMJm1Z56HVa6dQ/exec" };
let PW = null;
let ROLE = null;
let LOGIN_STAFF = '';

function esc(v){ return String(v ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch])); }
function formatPhone(v){ const n=String(v||'').replace(/\D/g,''); if(n.length===11)return n.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3'); if(n.length===10)return n.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3'); return n; }
async function adminApi(action, extra={}){
  const res=await fetch(CONFIG.WEBAPP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,pw:PW,...extra})});
  return res.json();
}
function handleUnauthorized(data){
  if(data && data.result==='unauthorized'){ logout(); document.getElementById('loginMsg').textContent='인증이 만료되었거나 비밀번호가 변경되었습니다.'; return true; }
  return false;
}

function applyRoleUI(){
  const isAdmin = ROLE === 'admin';
  const badge = document.getElementById('roleBadge');
  if(badge) badge.textContent = isAdmin ? '· 전체관리자' : (LOGIN_STAFF ? '· '+LOGIN_STAFF : '· 직원');

  const contentTab=document.getElementById('tabContent');
  if(contentTab) contentTab.style.display=isAdmin?'':'none';

  const assigneeWrap=document.getElementById('assigneeFilterWrap');
  const uaOnly=document.getElementById('unassignedOnlyWrap');
  const uaFirst=document.getElementById('unassignedFirstWrap');
  if(assigneeWrap) assigneeWrap.style.display=isAdmin?'':'none';
  if(uaOnly) uaOnly.style.display=isAdmin?'':'none';
  if(uaFirst) uaFirst.style.display=isAdmin?'':'none';
}

async function restoreSession(){
  const saved=sessionStorage.getItem('hiJeonggwonAdminPw');
  if(!saved) return;
  PW=saved;
  try{
    const data=await adminApi('admin_login');
    if(data.result==='success'){
      ROLE=data.role||'staff';
      LOGIN_STAFF=data.staff||'';
      sessionStorage.setItem('hiJeonggwonRole',ROLE);
      sessionStorage.setItem('hiJeonggwonStaff',LOGIN_STAFF);
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('appShell').style.display='block';
      applyRoleUI();
      loadLeads();
    }else logout();
  }catch(e){ logout(); }
}

window.addEventListener('load',()=>{
  const tw=document.querySelector('#panel-leads .tablewrap'); if(tw) tw.scrollLeft=0;
  restoreSession();
});

async function login(){
  const pw=document.getElementById('pwInput').value; const msg=document.getElementById('loginMsg'); msg.textContent='';
  try{
    PW=pw; const data=await adminApi('admin_login');
    if(data.result==='success'){
      ROLE=data.role||'staff';
      LOGIN_STAFF=data.staff||'';
      sessionStorage.setItem('hiJeonggwonAdminPw',pw);
      sessionStorage.setItem('hiJeonggwonRole',ROLE);
      sessionStorage.setItem('hiJeonggwonStaff',LOGIN_STAFF);
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('appShell').style.display='block';
      applyRoleUI();
      loadLeads();
    }else{
      PW=null; ROLE=null; LOGIN_STAFF='';
      msg.textContent='비밀번호가 올바르지 않습니다.';
    }
  }catch(e){
    PW=null; ROLE=null; LOGIN_STAFF='';
    msg.textContent='접속 오류. WEBAPP_URL 또는 Apps Script 배포를 확인하세요.';
    console.error(e);
  }
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  if(ROLE!=='admin' && t.dataset.tab==='content') return;

// ---------- 리드 관리 ----------
let allLeads=[];
let staffDirectory=[];
async function loadLeads(){
  const tbody=document.getElementById('leadRows');
  tbody.innerHTML='<tr><td colspan="14" style="text-align:center;color:var(--ink-soft);">불러오는 중...</td></tr>';
  try{
    const data=await adminApi('admin_leads');
    if(handleUnauthorized(data))return;
    if(data.result!=='success'){
      tbody.innerHTML='<tr><td colspan="14">불러오기 실패</td></tr>';
      return;
    }
    ROLE=data.role||ROLE||'staff';
    LOGIN_STAFF=data.staff||LOGIN_STAFF||'';
    applyRoleUI();
    allLeads=Array.isArray(data.leads)?data.leads:[];
    staffDirectory=Array.isArray(data.staffDirectory)?data.staffDirectory.filter(x=>x&&x.staff):[];

    // 일부 배포버전에서 admin_leads 응답에 staffDirectory가 없을 수 있으므로
    // 정산 API의 직원명부를 자동 fallback으로 사용한다.
    if(!staffDirectory.length){
      try{
        const settle=await adminApi('admin_settlement');
        if(settle && settle.result==='success' && Array.isArray(settle.settlement)){
          staffDirectory=settle.settlement
            .filter(x=>x&&x.staff)
            .map(x=>({staff:String(x.staff), org:String(x.org||'')}));
        }
      }catch(ignore){ console.warn('담당자 명부 fallback 로딩 실패', ignore); }
    }
    renderLeadRows();
  }catch(e){
    tbody.innerHTML='<tr><td colspan="14" style="color:var(--danger);">불러오기 실패</td></tr>';
    console.error(e);
  }
}
function statusClass(status){
  return ({'신규':'status-new','연락완료':'status-contact','상담중':'status-progress','방문예약':'status-visit','계약완료':'status-done','실패':'status-fail'})[status]||'';
}
function applyStatusStyle(sel){
  ['status-new','status-contact','status-progress','status-visit','status-done','status-fail'].forEach(c=>sel.classList.remove(c));
  const c=statusClass(sel.value); if(c) sel.classList.add(c);
}
function applyAssigneeStyle(sel){ sel.classList.toggle('assignee-unassigned', !sel.value); }
function leadDateOnly(v){ const m=String(v||'').match(/\d{4}-\d{2}-\d{2}/); return m?m[0]:''; }
function fillAssigneeFilter(){
  const sel=document.getElementById('f_assignee'); const current=sel.value;
  if(ROLE==='staff'){
    sel.innerHTML='';
    const o=document.createElement('option'); o.value=LOGIN_STAFF; o.textContent=LOGIN_STAFF||'내 담당'; sel.appendChild(o);
    sel.value=LOGIN_STAFF;
    return;
  }
  sel.innerHTML='<option value="">전체</option><option value="__UNASSIGNED__">미지정</option>';
  [...staffDirectory].sort((a,b)=>String(a.staff||'').localeCompare(String(b.staff||''),'ko')).forEach(x=>{
    if(!x.staff)return; const o=document.createElement('option'); o.value=x.staff; o.textContent=x.staff+(x.org?' · '+x.org:''); sel.appendChild(o);
  });
  if(Array.from(sel.options).some(o=>o.value===current)) sel.value=current;
}
function getFilteredLeads(){
  const fs=document.getElementById('f_source').value;
  const fst=document.getElementById('f_status').value;
  const fa=ROLE==='admin'?document.getElementById('f_assignee').value:LOGIN_STAFF;
  const q=document.getElementById('f_search').value.trim().toLowerCase();
  const from=document.getElementById('f_from').value;
  const to=document.getElementById('f_to').value;
  const unassignedOnly=ROLE==='admin' ? document.getElementById('f_unassigned_only').checked : false;
  const unassignedFirst=ROLE==='admin' ? document.getElementById('f_unassigned_first').checked : false;
  let rows=allLeads.filter(l=>{
    if(fs && l.source!==fs)return false;
    if(fst && l.status!==fst)return false;
    if(unassignedOnly && l.assignee)return false;
    if(fa==='__UNASSIGNED__' && l.assignee)return false;
    if(fa && fa!=='__UNASSIGNED__' && String(l.assignee||'')!==fa)return false;
    const d=leadDateOnly(l.createdAt);
    if(from && (!d || d<from))return false;
    if(to && (!d || d>to))return false;
    if(q){
      const hay=[l.name,l.phone,l.service,l.area,l.staff,l.assignee,l.contact,l.status].map(v=>String(v||'').toLowerCase()).join(' ');
      const qDigits=q.replace(/\D/g,'');
      const phoneDigits=String(l.phone||'').replace(/\D/g,'');
      if(!hay.includes(q) && !(qDigits.length>=3 && phoneDigits.includes(qDigits)))return false;
    }
    return true;
  });
  if(unassignedFirst){ rows=[...rows].sort((a,b)=>(a.assignee?1:0)-(b.assignee?1:0)); }
  return rows;
}
['f_source','f_status','f_assignee','f_from','f_to','f_unassigned_only','f_unassigned_first'].forEach(id=>document.getElementById(id).addEventListener('change',renderLeadRows));
document.getElementById('f_search').addEventListener('input',renderLeadRows);
function resetLeadFilters(){
  document.getElementById('f_search').value=''; document.getElementById('f_source').value=''; document.getElementById('f_status').value='';
  document.getElementById('f_assignee').value=ROLE==='staff'?LOGIN_STAFF:''; document.getElementById('f_from').value=''; document.getElementById('f_to').value='';
  document.getElementById('f_unassigned_only').checked=false; document.getElementById('f_unassigned_first').checked=ROLE==='admin'; renderLeadRows();
}
function renderLeadRows(){
  fillAssigneeFilter();
  const filtered=getFilteredLeads(); const tbody=document.getElementById('leadRows');
  document.getElementById('leadEmpty').style.display=filtered.length?'none':'block'; tbody.innerHTML='';
  filtered.forEach(l=>{
    const tr=document.createElement('tr'); const src=l.source==='HI'?'HI':(l.source==='JK'?'JK':'');
    if(!l.assignee) tr.classList.add('row-unassigned');
    tr.innerHTML=`<td>${esc(l.createdAt)}</td><td><span class="pill ${src}">${esc(src)}${l.staff?' · '+esc(l.staff):''}</span></td><td></td><td title="${esc(l.name)}">${esc(l.name)}</td><td>${esc(formatPhone(l.phone))}</td><td title="${esc(l.service)}${l.area?' ('+esc(l.area)+')':''}">${esc(l.service)}${l.area?' ('+esc(l.area)+')':''}</td><td>${esc(l.moveDate||'-')}</td><td>${esc(l.contact||'-')}</td><td class="dup">${esc(l.dupFlag||'')}</td><td></td><td></td><td></td><td></td><td></td>`;
    const cells=tr.querySelectorAll('td');

    const assigneeSel=document.createElement('select'); assigneeSel.className='inline-select';
    if(ROLE==='staff'){
      const o=document.createElement('option'); o.value=LOGIN_STAFF; o.textContent=LOGIN_STAFF||l.assignee||'내 담당'; o.selected=true; assigneeSel.appendChild(o);
      assigneeSel.disabled=true;
      assigneeSel.title='직원 계정에서는 담당자를 변경할 수 없습니다.';
    }else{
      const blankOpt=document.createElement('option'); blankOpt.value=''; blankOpt.textContent='미지정'; assigneeSel.appendChild(blankOpt);
      const targetOrg=l.type==='A'?'정권통신':'하이부동산';
      let candidates=staffDirectory.filter(x=>String(x.org||'').includes(targetOrg.replace('부동산','')) || String(x.org||'')===targetOrg);
      if(!candidates.length)candidates=staffDirectory;
      candidates.forEach(x=>{const o=document.createElement('option');o.value=x.staff;o.textContent=x.staff+(x.org?' · '+x.org:'');if(String(l.assignee||'')===String(x.staff))o.selected=true;assigneeSel.appendChild(o);});
      if(l.assignee && !Array.from(assigneeSel.options).some(o=>o.value===l.assignee)){const o=document.createElement('option');o.value=l.assignee;o.textContent=l.assignee;o.selected=true;assigneeSel.appendChild(o);}
      applyAssigneeStyle(assigneeSel);
      assigneeSel.addEventListener('change',()=>{applyAssigneeStyle(assigneeSel);tr.classList.toggle('row-unassigned',!assigneeSel.value);});
    }
    cells[2].appendChild(assigneeSel);

    const statusSel=document.createElement('select'); statusSel.className='inline-select'; ['신규','연락완료','상담중','방문예약','계약완료','실패'].forEach(s=>{const o=document.createElement('option');o.textContent=s;if(s===l.status)o.selected=true;statusSel.appendChild(o);}); applyStatusStyle(statusSel); statusSel.addEventListener('change',()=>applyStatusStyle(statusSel)); cells[9].appendChild(statusSel);
    const dateInp=document.createElement('input');dateInp.type='date';dateInp.className='inline-input';dateInp.value=l.contractDate||'';cells[10].appendChild(dateInp);
    const revInp=document.createElement('input');revInp.type='number';revInp.className='inline-input';revInp.min='0';revInp.value=l.revenue??'';cells[11].appendChild(revInp);
    const settleSel=document.createElement('select');settleSel.className='inline-select';['미정산','정산완료'].forEach(s=>{const o=document.createElement('option');o.textContent=s;if(s===l.settleStatus)o.selected=true;settleSel.appendChild(o);});cells[12].appendChild(settleSel);
    const saveBtn=document.createElement('button');saveBtn.className='btn small';saveBtn.textContent='저장';saveBtn.onclick=()=>updateLead(l.id,statusSel.value,revInp.value,dateInp.value,settleSel.value,assigneeSel.value,saveBtn);cells[13].appendChild(saveBtn);tbody.appendChild(tr);
  });
  const unassigned=allLeads.filter(l=>!l.assignee).length;
  document.getElementById('leadStats').innerHTML = ROLE==='admin'
    ? `<span>전체 ${allLeads.length}건</span><span>필터 결과 ${filtered.length}건</span><span class="warn">미지정 ${unassigned}건</span>`
    : `<span>${esc(LOGIN_STAFF)} 담당 ${allLeads.length}건</span><span>필터 결과 ${filtered.length}건</span>`;
  const tw=document.querySelector('#panel-leads .tablewrap'); if(tw)tw.scrollLeft=0;
}
function csvCell(v){
  let s=String(v??''); if(/^[=+\-@]/.test(s))s="'"+s; return '"'+s.replace(/"/g,'""')+'"';
}
function downloadLeadsCsv(){
  const rows=getFilteredLeads(); if(!rows.length){alert('다운로드할 리드가 없습니다.');return;}
  const headers=['접수일','유입','소개직원','담당자','고객명','연락처','서비스','이사일','상담방법','중복','상태','계약일','매출액','정산'];
  const body=rows.map(l=>[l.createdAt,l.source,l.staff,l.assignee,l.name,formatPhone(l.phone),l.service+(l.area?' ('+l.area+')':''),l.moveDate,l.contact,l.dupFlag,l.status,l.contractDate,l.revenue,l.settleStatus].map(csvCell).join(','));
  const csv='\uFEFF'+headers.map(csvCell).join(',')+'\r\n'+body.join('\r\n'); const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='HI_정권_PASS_리드_'+new Date().toISOString().slice(0,10)+'.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
async function updateLead(id,status,revenue,contractDate,settled,assignee,btn){
  btn.textContent='저장중';btn.disabled=true;
  try{
    const data=await adminApi('update_status',{id,status,revenue,contractDate,settled,assignee});
    if(handleUnauthorized(data))return;
    if(data.result==='success'){
      btn.textContent='완료';
      const item=allLeads.find(x=>String(x.id)===String(id));
      if(item){item.status=status;item.revenue=revenue;item.contractDate=contractDate;item.settleStatus=settled;item.assignee=assignee;}
      setTimeout(renderLeadRows,250);
    }else btn.textContent='실패';
  }catch(e){btn.textContent='오류';console.error(e);}finally{setTimeout(()=>{if(btn.isConnected){btn.textContent='저장';btn.disabled=false;}},1200);}
}

// ---------- 정산 현황 ----------
async function loadSettlement(){
  const tbody=document.getElementById('settleRows');tbody.innerHTML='<tr><td colspan="10" style="text-align:center;color:var(--ink-soft);">불러오는 중...</td></tr>';
  try{const data=await adminApi('admin_settlement');if(handleUnauthorized(data))return;ROLE=data.role||ROLE;LOGIN_STAFF=data.staff||LOGIN_STAFF||'';applyRoleUI();const rows=Array.isArray(data.settlement)?data.settlement:[];document.getElementById('settleEmpty').style.display=rows.length?'none':'block';tbody.innerHTML=rows.map(r=>`<tr><td>${esc(r.staff)}</td><td>${esc(r.org)}</td><td>${esc(r.introCount)}</td><td>${esc(r.assignedCount)}</td><td>${esc(r.contractCount)}</td><td>${r.assignedCount?(Number(r.convRate)*100).toFixed(1)+'%':'-'}</td><td>${esc(fmt(r.totalRevenue))}</td><td>${esc(fmt(r.totalRebate))}</td><td>${esc(fmt(r.settledAmount))}</td><td>${esc(fmt(r.unsettledAmount))}</td></tr>`).join('');}
  catch(e){tbody.innerHTML='<tr><td colspan="9" style="color:var(--danger);">불러오기 실패</td></tr>';console.error(e);}
}
function fmt(n){return n!==''&&n!==null&&n!==undefined&&Number(n)!==0?Number(n).toLocaleString()+'원':'-';}

// ---------- 콘텐츠 관리 ----------
async function loadContent(){
  if(ROLE!=='admin') return;
  try{const data=await adminApi('admin_content');if(handleUnauthorized(data))return;if(data.result!=='success')return;const c=data.content||{};
    document.getElementById('c_title').value=c.hero?.title||'';document.getElementById('c_subtitle').value=c.hero?.subtitle||'';document.getElementById('c_tagline').value=c.hero?.tagline||'';
    document.getElementById('c_logo_text').value=c.logo?.logoText||'';document.getElementById('c_logo_img').value=c.logo?.logoImageUrl||'';document.getElementById('c_video_a').value=c.logo?.videoA||'';document.getElementById('c_video_b').value=c.logo?.videoB||'';
    document.getElementById('c_a_title').value=c.cards?.A?.title||'';document.getElementById('c_a_who').value=c.cards?.A?.who||'';document.getElementById('c_b_title').value=c.cards?.B?.title||'';document.getElementById('c_b_who').value=c.cards?.B?.who||'';
    const benefitList=document.getElementById('benefitList');benefitList.innerHTML='';(c.benefits||[]).forEach(b=>benefitList.appendChild(benefitRowEl(b)));
    const bannerList=document.getElementById('bannerList');bannerList.innerHTML='';(c.banners||[]).forEach(b=>bannerList.appendChild(bannerRowEl(b)));
    document.getElementById('svc_a').value=(data.services?.A||[]).join('\n');document.getElementById('svc_b').value=(data.services?.B||[]).join('\n');
  }catch(e){console.error(e);}
}
function benefitRowEl(b){b=b||{type:'A',order:1,text:'',visible:'Y'};const div=document.createElement('div');div.className='rowline';
  const sel=document.createElement('select');sel.className='bf_type';['A','B'].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;if(b.type===v)o.selected=true;sel.appendChild(o);});
  const inp=document.createElement('input');inp.type='text';inp.className='bf_text';inp.value=b.text||'';inp.placeholder='혜택 내용';
  const label=document.createElement('label');label.style.cssText='font-size:12px;display:flex;align-items:center;gap:4px;';const cb=document.createElement('input');cb.type='checkbox';cb.className='bf_visible';cb.checked=String(b.visible).toUpperCase()==='Y';label.append(cb,document.createTextNode(' 노출'));
  const rm=document.createElement('button');rm.className='removebtn';rm.textContent='✕';rm.onclick=()=>div.remove();div.append(sel,inp,label,rm);return div;}
function addBenefitRow(){document.getElementById('benefitList').appendChild(benefitRowEl());}
function bannerRowEl(b){b=b||{order:1,imageUrl:'',caption:'',visible:'N'};const div=document.createElement('div');div.className='rowline banner';
  const ord=document.createElement('input');ord.type='number';ord.className='bn_order';ord.value=b.order||1;ord.min='1';const url=document.createElement('input');url.type='text';url.className='bn_url';url.value=b.imageUrl||'';url.placeholder='이미지 URL';const cap=document.createElement('input');cap.type='text';cap.className='bn_caption';cap.value=b.caption||'';cap.placeholder='문구';
  const label=document.createElement('label');label.style.cssText='font-size:12px;display:flex;align-items:center;gap:4px;';const cb=document.createElement('input');cb.type='checkbox';cb.className='bn_visible';cb.checked=String(b.visible).toUpperCase()==='Y';label.append(cb,document.createTextNode(' 노출'));const rm=document.createElement('button');rm.className='removebtn';rm.textContent='✕';rm.onclick=()=>div.remove();div.append(ord,url,cap,label,rm);return div;}
function addBannerRow(){document.getElementById('bannerList').appendChild(bannerRowEl());}
async function saveContent(){
  if(ROLE!=='admin'){ alert('관리자만 콘텐츠를 수정할 수 있습니다.'); return; }
  const benefits=Array.from(document.querySelectorAll('#benefitList .rowline')).map((el,i)=>({type:el.querySelector('.bf_type').value,order:i+1,text:el.querySelector('.bf_text').value.trim(),visible:el.querySelector('.bf_visible').checked?'Y':'N'})).filter(b=>b.text);
  const banners=Array.from(document.querySelectorAll('#bannerList .rowline')).map(el=>({order:Number(el.querySelector('.bn_order').value)||1,imageUrl:el.querySelector('.bn_url').value.trim(),caption:el.querySelector('.bn_caption').value.trim(),visible:el.querySelector('.bn_visible').checked?'Y':'N'})).filter(b=>b.imageUrl);
  const payload={content:{hero:{title:document.getElementById('c_title').value,subtitle:document.getElementById('c_subtitle').value,tagline:document.getElementById('c_tagline').value},cards:{A:{title:document.getElementById('c_a_title').value,who:document.getElementById('c_a_who').value},B:{title:document.getElementById('c_b_title').value,who:document.getElementById('c_b_who').value}},benefits,banners,logo:{logoText:document.getElementById('c_logo_text').value,logoImageUrl:document.getElementById('c_logo_img').value},videos:{videoA:document.getElementById('c_video_a').value,videoB:document.getElementById('c_video_b').value}},services:{A:document.getElementById('svc_a').value.split('\n').map(s=>s.trim()).filter(Boolean),B:document.getElementById('svc_b').value.split('\n').map(s=>s.trim()).filter(Boolean)}};
  const toast=document.getElementById('contentToast');try{const data=await adminApi('update_content',payload);if(handleUnauthorized(data))return;toast.className=data.result==='success'?'toast ok':'toast err';toast.textContent=data.result==='success'?'저장 완료!':'저장 실패: '+(data.message||'');}catch(e){toast.className='toast err';toast.textContent='저장 중 오류가 발생했습니다.';console.error(e);}
}
