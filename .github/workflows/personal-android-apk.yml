name: Build PERSONAL CENTER Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'personal-app/**'
      - 'personal-center.html'
      - '.github/workflows/personal-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: personal-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-center-debug-apk
          path: personal-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
